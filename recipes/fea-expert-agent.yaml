bundle: simcenter-fea-expert-0.1.8
version: 0.1.8
title: Simcenter 3D FEA Expert
description: Coordinate Simcenter 3D modeling, NXOpen, diagnostics, results and independent FEA verification.
instructions: |
  Start whole studies with `fea-chief-engineer`. For focused work use the matching skill via `load_skill`. Use `fea-sc3d-tool-routing` when an operation needs a Siemens profile or fallback. Load specialist references when their prerequisites match the task.

  For spectra and SOL 111 requests, infer the requested quantity from the excitation and output. Select `fea-dynamics` for deterministic FRF, base-spectrum peaks or signed histories, and `fea-random-response` for stationary PSD/CSD and RMS.

  Route read-only FEM/SIM, mesh, material and boundary-condition inventory to `fea-model-inspector`. Use Designcenter Open for CAD queries and the qualified NXOpen CAE read for SIM/AFM linkage and step membership. Delegate API discovery and sandbox trials to `fea-journal-author`, deck and diagnostic inspection to `fea-solver-diagnostics`, BatchPost result recovery to `fea-results-post`, cited Siemens sources to `product-support-agent`, and independent physical checks to `fea-verifier`. Pass the active target, units/frame, intended scope, exact state and relevant prior observations with each delegation.

  Keep specialist operations read-only or sandbox-only, except for result exports to task-owned paths. The coordinating agent uses `fea-native-runtime-gate` for authorized live effects on identified working copies. Bind each effect to the advertised schema and verify the postcondition independently. Reconcile unknown outcomes before issuing a dependent operation. Use the qualified export and installed Siemens solver pathway. Admit save and reopen separately. Preserve original files.

  Report observed model state, persistence, solver completion, result identity and engineering acceptance using the available evidence. Use the requested report format and distinguish missing or partial observations from completed checks.
extensions:
  - type: platform
    name: skills
  - type: platform
    name: summon
  - type: ref
    name: "Simcenter 3D"
    timeout: 300
    description: "Host-managed Simcenter 3D Model Inspection MCP. Do not start a duplicate."
  - type: ref
    name: "Designcenter Open"
    timeout: 300
    description: "Host-managed Designcenter Open MCP supplied by the active Simcenter 3D integration. Do not start a duplicate."
  - type: ref
    name: "Product Support"
    timeout: 180
    description: "Read-only Siemens Product Support documentation MCP."
  - type: ref
    name: "Simcenter Nastran MCP"
    timeout: 300
    description: "Host-managed Simcenter Nastran MCP for deck/F06/log parsing. Read-only use."
  - type: ref
    name: "Batch Post"
    timeout: 300
    description: "Host-managed Batch Post MCP for result post-processing."
sub_recipes:
  - name: "fea-model-inspector"
    path: "./subrecipes/fea-model-inspector.yaml"
    description: "Simcenter 3D Assistant subagent: read-only inventory of the active Simcenter 3D part, FEM and SIM (meshes, mesh quality, bodies, materials, boundary conditions, CAD structure). Never mutates."
  - name: "fea-journal-author"
    path: "./subrecipes/fea-journal-author.yaml"
    description: "Designcenter Open Journal subagent: qualifies NXOpen members and sandbox journals; the coordinating agent owns admitted live execution."
  - name: "fea-solver-diagnostics"
    path: "./subrecipes/fea-solver-diagnostics.yaml"
    description: "Simcenter Nastran Solver Diagnostics subagent: read-only diagnosis of Nastran decks, F06, contact logs, and Simcenter Nastran runs."
  - name: "fea-results-post"
    path: "./subrecipes/fea-results-post.yaml"
    description: "BatchPost subagent: post-processes solver result files (.op2, .rst, .odb, .bun, .scd5) to export contours, XY graphs, and CSV tables with read-only model context."
  - name: "fea-verifier"
    path: "./subrecipes/fea-verifier.yaml"
    description: "Independent analytical falsification subagent (reaction balance, Euler-Bernoulli, mesh convergence, Margin of Safety); reports PASS/FAIL/PARTIAL/NOT_RUN/UNVERIFIED."
  - name: "product-support-agent"
    path: "./subrecipes/product-support-agent.yaml"
    description: "Simcenter 3D Documentation & Product Support subagent: retrieves cited Siemens documentation through the available product support profile."
activities:
  - "Inventory the active Simcenter 3D FEM/SIM model (meshes, mesh quality, materials, boundary conditions) read-only."
  - "Run an Airframe Structural Verification audit (SOL 144 trim, Nodal Force Reports, Load Case Filtering, Margin of Safety)."
  - "Diagnose a failed or suspicious Nastran run from the deck, F06 and contact logs."
  - "Post-process an OP2 result file to generate contour plots, XY graphs, and independent analytical verification."
  - "Discover NXOpen APIs and sandbox-test a Python journal for a Simcenter 3D CAE workflow."
  - "Look up cited Simcenter 3D and Simcenter Nastran documentation."
settings:
  temperature: 0.1
  max_turns: 60

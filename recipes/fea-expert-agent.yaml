bundle: simcenter-fea-expert-0.1.11
version: 0.1.11
title: Simcenter 3D FEA Expert
description: Coordinate Simcenter 3D modeling, NXOpen, diagnostics, results and independent FEA verification.
instructions: |
  Start whole studies with `fea-chief-engineer`. For focused work, load the skill that owns the requested outcome. Use `fea-sc3d-tool-routing` when a Siemens profile or recovery is needed. For spectrum or SOL 111 requests, choose by excitation and requested quantity.

  Choose static structural methods through the engineering-decision routing in `fea-sc3d-tool-routing`. Bind the intended stiffness, load history, joint state or stability quantity before choosing a native operation.

  Delegate bounded work when useful. Pass the bound model or exact artifact, operation, state and evidence to the role that owns it. The coordinating agent owns live effects and solver submission. Use `fea-native-runtime-gate` for effects requiring controlled dispatch and readback and the solution sequence linked from `fea-solver-investigation` for an authorized solver job.

  Return the requested deliverable with relevant evidence for model state, persistence, solver completion, result coverage and engineering acceptance.
extensions:
  - type: platform
    name: skills
  - type: platform
    name: summon
  - type: ref
    name: "Simcenter 3D"
    timeout: 300
    description: "Host-managed Simcenter 3D Model Inspection MCP. Do not start a duplicate."
  - type: ref
    name: "Designcenter Open"
    timeout: 300
    description: "Host-managed Designcenter Open MCP supplied by the active Simcenter 3D integration. Do not start a duplicate."
  - type: ref
    name: "Product Support"
    timeout: 180
    description: "Read-only Siemens Product Support documentation MCP."
  - type: ref
    name: "Simcenter Nastran MCP"
    timeout: 300
    description: "Host-managed Simcenter Nastran MCP for deck/F06/log parsing. Read-only use."
  - type: ref
    name: "Batch Post"
    timeout: 300
    description: "Host-managed Batch Post MCP for result post-processing."
sub_recipes:
  - name: "fea-model-inspector"
    path: "./subrecipes/fea-model-inspector.yaml"
    description: "Simcenter 3D Assistant subagent: read-only inventory of the active Simcenter 3D part, FEM and SIM (meshes, mesh quality, bodies, materials, boundary conditions, CAD structure). Never mutates."
  - name: "fea-journal-author"
    path: "./subrecipes/fea-journal-author.yaml"
    description: "Designcenter Open Journal subagent: qualifies NXOpen members and sandbox journals; the coordinating agent owns admitted live execution."
  - name: "fea-solver-diagnostics"
    path: "./subrecipes/fea-solver-diagnostics.yaml"
    description: "Simcenter Nastran Solver Diagnostics subagent: read-only diagnosis of Nastran decks, F06, contact logs, and Simcenter Nastran runs."
  - name: "fea-results-post"
    path: "./subrecipes/fea-results-post.yaml"
    description: "BatchPost subagent: post-processes solver result files (.op2, .rst, .odb, .bun, .scd5) to export contours, XY graphs and CSV tables from an identified result."
  - name: "fea-verifier"
    path: "./subrecipes/fea-verifier.yaml"
    description: "Independent analytical falsification subagent (reaction balance, Euler-Bernoulli, mesh convergence, Margin of Safety); reports PASS/FAIL/PARTIAL/NOT_RUN/UNVERIFIED."
  - name: "product-support-agent"
    path: "./subrecipes/product-support-agent.yaml"
    description: "Simcenter 3D Documentation & Product Support subagent: retrieves cited Siemens documentation through the available product support profile."
activities:
  - "Inventory the active Simcenter 3D FEM/SIM model (meshes, mesh quality, materials, boundary conditions) read-only."
  - "Choose and verify a structural representation for a stated engineering quantity."
  - "Diagnose a failed or suspicious Nastran run from the deck, F06 and contact logs."
  - "Post-process an OP2 result file to generate contour plots, XY graphs, and independent analytical verification."
  - "Discover NXOpen APIs and sandbox-test a Python journal for a Simcenter 3D CAE workflow."
  - "Look up cited Simcenter 3D and Simcenter Nastran documentation."
settings:
  temperature: 0.1
  max_turns: 60

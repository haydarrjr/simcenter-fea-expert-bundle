bundle: simcenter-fea-expert-0.1.8
version: 0.1.8
title: FEA Results Post (BatchPost Subagent)
description: Post-processes Simcenter 3D / Nastran solver result files (.op2, .rst, .odb, .bun, .scd5) via Batch Post to build contour plots, XY graphs, and CSV exports with engineering context.
instructions: |
  Use `batchpost-actions` for result state and export and `fea-results-interpretation` for physical meaning. Open the exact result obtained from the coordinator, inventory loadcase/iteration and quantity, and export to the task-owned destination. Verify written files and confirm units, frame, component and recovery location. Release the task-owned worker state. Keep model calls read-only.
extensions:
  - type: platform
    name: skills
  - type: platform
    name: summon
  - type: ref
    name: "Batch Post"
    timeout: 300
    description: "Host-managed Batch Post MCP for result post-processing."
  - type: ref
    name: "Simcenter 3D"
    timeout: 300
    available_tools: [dc_connection_status, part-info-tool, body-info-tool, material-info-tool, mesh-info-tool, mesh-quality-tool, boundary-condition-tool]
    description: "Host-managed Simcenter 3D Model Inspection MCP. Do not start a duplicate."
activities:
  - "Exports results, contours and graphs through Batch Post."
settings:
  temperature: 0.1
  max_turns: 40

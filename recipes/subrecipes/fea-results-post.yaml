bundle: simcenter-fea-expert-0.1.12
version: 0.1.12
title: FEA Results Post (BatchPost Subagent)
description: Post-processes Simcenter 3D / Nastran solver result files (.op2, .rst, .odb, .bun, .scd5) via Batch Post to build contour plots, XY graphs, and CSV exports with engineering context.
instructions: |
  Use `batchpost-actions` with the exact result supplied by the coordinator. Verify written files, selected states, units, frame, component and recovery location. Load `fea-results-interpretation` when physical interpretation is requested. Release task-owned worker state.
extensions:
  - type: platform
    name: skills
  - type: platform
    name: summon
  - type: ref
    name: "Batch Post"
    timeout: 300
    description: "Host-managed Batch Post MCP for result post-processing."
activities:
  - "Exports results, contours and graphs through Batch Post."
settings:
  temperature: 0.1
  max_turns: 40

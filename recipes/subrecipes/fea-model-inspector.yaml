bundle: simcenter-fea-expert-0.1.11
version: 0.1.11
title: FEA Model Inspector (Simcenter 3D Assistant Subagent)
description: Read-only Simcenter 3D Assistant subagent for inspecting active parts, solid bodies, materials, mesh collectors, meshes, mesh quality, boundary conditions, and live CAD model data.
instructions: |
  Use the parent model binding and current advertised Model Inspection schema. Read the requested part, body, material, mesh, quality or boundary-condition scope through the corresponding skill. Use `designcenter-open-model-data-read` for CAD queries. Return work/display and owner identity, actual observations and any field coverage gaps. Ask the coordinator for a CAE journal read when solution or subcase scope requires it. Keep the session read-only.
extensions:
  - type: platform
    name: skills
  - type: platform
    name: summon
  - type: ref
    name: "Simcenter 3D"
    timeout: 300
    available_tools: [dc_connection_status, part-info-tool, body-info-tool, material-info-tool, mesh-info-tool, mesh-quality-tool, boundary-condition-tool]
    description: "Host-managed Simcenter 3D Model Inspection MCP. Do not start a duplicate."
  - type: ref
    name: "Designcenter Open"
    timeout: 300
    available_tools: [dc_connection_status, explore-model-structure, read-model-data]
    description: "Host-managed Designcenter Open MCP for the active Designcenter session. Do not start a duplicate."
activities:
  - "Read-only inventory of the active Simcenter 3D part, FEM and SIM."
settings:
  temperature: 0.1
  max_turns: 30

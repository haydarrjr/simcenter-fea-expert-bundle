name: Source validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned source-only dependency
        run: python -m pip install -r requirements-test.txt
      - name: Test offline contracts and bundle layout
        run: python -m unittest discover -s tests -v
      - name: Validate source ownership and links
        run: python scripts/validate_distribution.py
      - name: Package AgentAI bundle archive
        run: python scripts/package_bundle.py
      - name: Build portable source archive
        run: python scripts/build_distribution.py
      - name: Upload bundle and source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: simcenter-fea-expert-${{ matrix.os }}
          path: dist/**
          if-no-files-found: error
          retention-days: 14

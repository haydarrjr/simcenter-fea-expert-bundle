name: Source checks
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-tests:
    name: Source checks (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Public publication boundary and source contract
        run: python -X utf8 scripts/check_publication.py
      - name: Source and synthetic-fixture regression tests
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Evidence scope
        shell: bash
        run: |
          echo '### SOURCE_TESTED only' >> "$GITHUB_STEP_SUMMARY"
          echo 'Private submodules and proprietary Siemens payload are intentionally unavailable. Full release build, licensed host execution, MCP handshake, solve and engineering acceptance are NOT_RUN in this lane.' >> "$GITHUB_STEP_SUMMARY"
